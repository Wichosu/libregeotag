name: libregeotag
description: "Give your photographs a place and a story. Local-first location memories for Android and iOS."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  # Material Design widgets. Official Flutter package; package:flutter/material.dart
  # is deprecated as of Flutter 3.47.
  gal: ^3.0.0
  geolocator: ^14.1.2
  http: ^1.6.0
  image: ^4.12.0
  image_picker: ^1.2.4
  material_ui: ^1.11.0
  native_exif: ^0.8.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
